<!doctype html><html lang="th"><head><meta charset="utf-8"><link rel="stylesheet" href="/common.css"><style>
body { background: var(--brand); color: #fff; display: grid; place-items: center; }
body::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: var(--accent); }
.box { text-align: center; }
.kick { font: 600 22px 'Plex'; color: #b9c8d8; letter-spacing: .06em; opacity: 0; animation: up .7s .1s forwards; }
h1 { font: 700 104px/1.1 'Plex'; margin: 10px 0 10px; opacity: 0; animation: up .7s .3s forwards; }
h2 { font: 600 36px/1.4 'Plex'; margin: 0 0 34px; opacity: 0; animation: up .7s .6s forwards; }
.chips { display: flex; gap: 12px; justify-content: center; opacity: 0; animation: up .7s 1s forwards; }
.chips span { border: 1.5px solid rgba(255,255,255,.4); border-radius: 6px; padding: 6px 18px; font: 600 22px 'Plex'; }
.chips span:first-child { background: var(--accent); border-color: var(--accent); }
@keyframes up { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
</style></head><body><div class="box">
<div class="kick">Claude Code plugin</div>
<h1>manual-kit</h1>
<h2>คู่มือการใช้งานระบบแบบทางการ จากโค้ดและหน้าจอจริง</h2>
<div class="chips"><span>PDF</span><span>Word</span><span>เว็บคู่มือ</span><span>ภาพทีละขั้น</span></div>
</div></body></html>
